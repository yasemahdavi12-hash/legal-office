# Optional local MySQL for migrate/CRUD tests (requires Docker).
# Usage: docker compose up -d
# Then set DB_CLIENT=mysql and the DB_* vars below in .env
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: legal_app
      MYSQL_USER: legal_user
      MYSQL_PASSWORD: legal_pass
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
